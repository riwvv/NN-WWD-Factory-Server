name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PythonServer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test/lint dependencies
        run: pip install flake8 pytest pydantic numpy python-Levenshtein

      - name: Lint
        run: flake8 app tests main.py

      - name: Test
        run: pytest tests -v
